[project]
name = "ai-tenant-leak-test"
version = "0.1.0"
description = "Pre-release negative test suite for cross-tenant data leakage in multi-tenant AI features"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
devtarget = ["fastapi>=0.111", "uvicorn>=0.30"]

[project.scripts]
aitenant = "aitlt.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The domain models are named TestCase/TestResult/TestRun. Tests here are all
# functions, so stop pytest trying to collect those classes.
python_classes = "_NeverMatches"
markers = [
    "e2e: end-to-end tests that spawn a live devtarget process (slower)",
]
